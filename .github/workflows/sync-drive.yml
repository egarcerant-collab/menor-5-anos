name: Sincronizar datos de Drive

on:
  schedule:
    # Cada 6 horas. Las matrices se actualizan aprox. una vez al mes, así que
    # esto es más que suficiente para tenerlas frescas sin gastar minutos de
    # más.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Nunca dos corridas en paralelo: si el cron y un "Actualizar ahora" manual
# coinciden, la segunda espera a que termine la primera en vez de chocar al
# escribir el mismo archivo (rebase no alcanza a resolver un conflicto real
# de contenido, solo el caso de "main avanzó pero no hay overlap").
concurrency:
  group: sync-drive
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Descargar y calcular indicadores desde Drive
        env:
          GOOGLE_DRIVE_CLIENT_EMAIL: ${{ secrets.GOOGLE_DRIVE_CLIENT_EMAIL }}
          GOOGLE_DRIVE_PRIVATE_KEY: ${{ secrets.GOOGLE_DRIVE_PRIVATE_KEY }}
        run: npx tsx scripts/sync-drive-data.ts

      - name: Commit si el resultado cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/drive-sync-latest.json
          if git diff --cached --quiet; then
            echo "Sin cambios."
            exit 0
          fi
          git commit -m "chore: actualizar datos desde Drive [skip ci]"
          # Respaldo del resultado ya calculado, por si un rebase con conflicto
          # real obliga a resetear el árbol de trabajo (no debería pasar con
          # el "concurrency" del workflow, pero por si acaso).
          cp src/data/drive-sync-latest.json /tmp/drive-sync-latest.json
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rechazado, reintentando ($i/5)..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Conflicto real en el rebase, se descarta y se reaplica el resultado calculado."
              git rebase --abort
              git reset --hard origin/main
              cp /tmp/drive-sync-latest.json src/data/drive-sync-latest.json
              git add src/data/drive-sync-latest.json
              git commit -m "chore: actualizar datos desde Drive [skip ci]"
            fi
            sleep 3
          done
          echo "No se pudo subir el commit tras varios intentos."
          exit 1
